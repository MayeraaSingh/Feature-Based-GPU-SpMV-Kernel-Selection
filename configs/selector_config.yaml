# Selector + evaluation experiment config (Member 3).
# One source of truth: the CLI scripts and the Colab notebook both read this file.
# Relative paths are resolved from the project root. CLI flags override paths.

paths:
  features: data/metadata/features.csv
  splits: data/metadata/splits.csv
  catalog: data/metadata/matrix_catalog.csv
  timings: benchmarks/kernel_timings.csv   # real GPU timings from Member 1

results_dir: results

selector:
  feature_columns:
    - rows
    - cols
    - nnz
    - mean_row_nnz
    - variance_row_nnz
    - max_row_nnz
    - min_row_nnz
  seed: 0
  tie_tolerance: 0.01          # relative; kernels within 1 % of the fastest count as tied
  refit_on_train_val: false    # Q2 (open): refit on train+val after tuning? Decide BEFORE the test run.
  grid:                        # hyperparameters tuned on the VALIDATION split only
    n_estimators: [100, 300]
    max_depth: [null, 4, 8]
    min_samples_leaf: [1, 2]
    class_weight: [null, balanced]

evaluation:
  bootstrap_samples: 2000
  bootstrap_seed: 0
